LIBRE_FW_FLASH_STR=Restarting system
LIBRE_FW_FLASH_TIMEOUT=180
MCU_FW_UPGRADE=1
MCU_FW_FLASH_TOOL="C:\Program Files (x86)\STMicroelectronics\STM32 ST-LINK Utility\ST-LINK Utility\ST-LINK_CLI.exe"
MCU_FW_FLASH_ARG=-c SWD -P $ 0x08004000 -V -Rst
MCU_FW_FILE=kello.1-app+sign-20170310_094550_1e9b014.hex
MCU_FW_FLASH_STR=Programming Complete

[TEST]
MAC_SCAN=1
LIBRE_MACMEM_CHECK=1
LIBRE_MACMEM_CHECK_CMD=netcfg
LIBRE_MACMEM_CHECK_STR=wlan0    UP.+
LIBRE_USB_CHECK=1
LIBRE_USB_CHECK_CMD=ls /media/usb
LIBRE_USB_CHECK_STR=lsimage
MCU_HELLO_CHECK=1
MCU_HELLO_CHECK_CMD=0c00
MCU_HELLO_CHECK_STR=20170310_094550_1e9b014