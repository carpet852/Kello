[INFO]
VERSION=1.0
FACTORY=etl
STATION=prog
STATION_NO=1
LOG_PATH=.\\log

[UART]
UART_BUF_SIZE=4096
LIBRE_COM_PORT=47
LIBRE_COM_BAUDRATE=57600
LIBRE_COM_PARITY=N
LIBRE_COM_STOPBIT=1
MCU_COM_PORT=19
MCU_COM_BAUDRATE=115200
MCU_COM_PARITY=N
MCU_COM_STOPBIT=1

[FIRMWARE]
LIBRE_FW_UPGRADE=1
